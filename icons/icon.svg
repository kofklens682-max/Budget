<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Source for the app icon. PNGs are rendered from this file. Keep artwork inside the
       centre circle (radius ~205) so Android's round/squircle masks never cut it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2BDDA0"/>
      <stop offset=".55" stop-color="#0FA57C"/>
      <stop offset="1" stop-color="#05705D"/>
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".12" r=".85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".42"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDF3E9"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFAA1D"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A7A"/>
      <stop offset="1" stop-color="#FF4F6A"/>
    </linearGradient>
    <linearGradient id="clasp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22C993"/>
      <stop offset="1" stop-color="#0A8B6B"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#013B2E" flood-opacity=".38"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#013B2E" flood-opacity=".25"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>

  <!-- cards peeking out of the wallet -->
  <g filter="url(#soft)">
    <g transform="rotate(-11 236 214)">
      <rect x="140" y="150" width="196" height="128" rx="20" fill="url(#coral)"/>
      <rect x="160" y="176" width="46" height="34" rx="8" fill="#FFFFFF" fill-opacity=".55"/>
    </g>
    <g transform="rotate(7 282 206)">
      <rect x="182" y="140" width="196" height="128" rx="20" fill="url(#gold)"/>
      <rect x="182" y="166" width="196" height="22" fill="#B86E00" fill-opacity=".22"/>
    </g>
  </g>

  <!-- wallet body -->
  <g filter="url(#drop)">
    <rect x="118" y="222" width="276" height="170" rx="38" fill="url(#wallet)"/>
  </g>
  <rect x="118" y="222" width="276" height="170" rx="38" fill="none" stroke="#FFFFFF" stroke-opacity=".9" stroke-width="3"/>
  <path d="M152 250 H360" stroke="#0FA57C" stroke-opacity=".18" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 13"/>

  <!-- clasp -->
  <g filter="url(#soft)">
    <rect x="304" y="270" width="108" height="76" rx="28" fill="url(#clasp)"/>
  </g>
  <circle cx="344" cy="308" r="13" fill="#FFFFFF"/>

  <!-- sparkle -->
  <path d="M392 126 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z" fill="#FFFFFF" fill-opacity=".9"/>
</svg>
