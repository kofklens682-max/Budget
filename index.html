<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Budget</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar" id="topbar"><span id="topbar-title"></span></div>
  <main id="view" class="view"></main>

  <nav class="tabbar" id="tabbar">
    <div class="tabs" id="tabs">
      <span class="tab-ind" aria-hidden="true"></span>
      <button data-act="tab" data-tab="home" aria-label="Overview">
        <svg viewBox="0 0 24 24"><path d="M3.5 10.2 12 3.5l8.5 6.7V19.5a1.5 1.5 0 0 1-1.5 1.5h-4.2v-6.2H9.2V21H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
        <span>Home</span>
      </button>
      <button data-act="tab" data-tab="history" aria-label="History">
        <svg viewBox="0 0 24 24"><path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12"/><circle cx="4.2" cy="6.5" r="1.1" class="fill"/><circle cx="4.2" cy="12" r="1.1" class="fill"/><circle cx="4.2" cy="17.5" r="1.1" class="fill"/></svg>
        <span>History</span>
      </button>
      <button data-act="tab" data-tab="stats" aria-label="Stats">
        <svg viewBox="0 0 24 24"><path d="M5.5 20v-6.5M12 20V5M18.5 20v-10"/></svg>
        <span>Stats</span>
      </button>
      <button data-act="tab" data-tab="goals" aria-label="Goals">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" class="fill"/></svg>
        <span>Goals</span>
      </button>
      <button data-act="tab" data-tab="schedule" aria-label="Schedule">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14.5" r="1" class="fill"/><circle cx="12" cy="14.5" r="1" class="fill"/></svg>
        <span>Schedule</span>
      </button>
    </div>
    <button class="fab" id="fab" data-act="fab" aria-label="Add">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>

  <div id="sheet-root"></div>
  <div id="dialog-root"></div>
  <div id="lock-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json,text/plain,.txt" hidden>

  <script src="icons.js"></script>
  <script src="js/keep.js"></script>
  <script src="js/core.js"></script>
  <script src="js/money.js"></script>
  <script src="js/groups.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
